<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ไร่สุขใจ 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Mitr:wght@500;600&family=Charmonman:wght@400;700&family=Sriracha&family=Mr+De+Haviland&family=Great+Vibes&family=Allura&family=Dancing+Script:wght@500;700&family=Sacramento&family=Caveat:wght@600&family=Mali:ital,wght@1,200;1,500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to the four corners with safe-area insets; sheets slide over the scene */
:root {
  --panel: rgba(22, 46, 33, 0.78);
  --panel-solid: #183424;
  --line: rgba(255, 255, 255, 0.14);
  --ink: #f6f3e8;
  --ink-dim: #c8d6c4;
  --sun: #ffcf3f;
  --leaf: #7ccf5a;
  --water: #5ab8f0;
  --danger: #e35b4a;
  --font-display: 'Mitr', 'Kanit', Tahoma, sans-serif;
  --font-body: 'Kanit', Tahoma, 'Leelawadee UI', sans-serif;
  --r: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #10241a; color: var(--ink); font-family: var(--font-body); user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
[hidden] { display: none !important; }
/* gentle lens vignette + grading over the 3D view (grading only on desktop GPUs) */
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 58%, rgba(8,18,12,0.32) 100%); }
body:not(.touch) #c { filter: saturate(1.1) contrast(1.04); }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
kbd { font-family: var(--font-body); background: rgba(255,255,255,0.16); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font-size: 0.85em; }

/* HUD */
.hud { position: fixed; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }
#hudTL { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(250px, 46vw); }
.panel { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
#stats { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
#money { font-family: var(--font-display); font-size: clamp(18px, 2.4vw, 24px); color: var(--sun); font-variant-numeric: tabular-nums; line-height: 1.1; }
.meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); flex-wrap: wrap; }
#clock { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }
#wx { font-size: 18px; line-height: 1; }
.bar { position: relative; height: 14px; border-radius: 8px; background: rgba(0,0,0,0.35); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 8px; transition: width .3s; }
.bar span { position: absolute; inset: 0; font-size: 10.5px; line-height: 14px; padding-left: 6px; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
#enBar { background: linear-gradient(90deg, #f5a623, var(--sun)); }
#wtBar { background: linear-gradient(90deg, #2f86c8, var(--water)); }
#enWrap.warn #enBar { background: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .5 } }
#loc { font-size: 12px; color: var(--ink-dim); }
#fps { position: fixed; left: 50%; top: max(6px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 6; pointer-events: none; font: 600 11px/1 Kanit, sans-serif; padding: 4px 8px; border-radius: 8px; background: rgba(20,30,25,.55); color: #9eeaa0; letter-spacing: .5px; }
#fps.mid { color: #ffd36b; } #fps.bad { color: #ff8a7a; }
.card p.dim { color: var(--ink-dim); font-size: 12.5px; }
#bPhone { position: relative; }
.chatlog { max-height: 150px; overflow-y: auto; margin: 4px 0; font-size: 13.5px; } .chatlog p { margin: 3px 0; } .chatlog .me { text-align: right; color: var(--sun); }
#slots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
#slots .slotbtn { font-size: 13px; padding: 8px 12px; line-height: 1.3; min-width: 150px; }
#slots small { font-size: 11px; opacity: .85; }
#slots .slotwrap { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
#slots .slotdel { font-size: 11px; padding: 4px 8px; opacity: .8; }
#slots .slotdel:hover { opacity: 1; color: #ff8a80; }
#tut { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(20, 60, 40, .9); color: #eaffef; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.35); }
#raceHud { position: fixed; left: 50%; top: calc(34px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 6; pointer-events: none; padding: 8px 16px; border-radius: 14px; background: rgba(15, 25, 40, .78); color: #ffd166; font: 600 17px/1.2 Kanit, sans-serif; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bPhone[data-n]:not([data-n=""])::after { content: attr(data-n); position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; border-radius: 8px; background: #e53935; color: #fff; font: 600 10px/16px Kanit, sans-serif; }
#modal.phone .mbox { width: min(420px, 100%); }
.ph-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); margin-bottom: 8px; }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; margin: 6px 0 14px; }
.apps button { background: none; border: 0; color: var(--ink); font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.apps button span { position: relative; width: 54px; height: 54px; border-radius: 16px; background: rgba(255,255,255,.1); border: 1px solid var(--line); display: grid; place-items: center; font-size: 27px; }
.apps button span i { position: absolute; top: -5px; right: -5px; font-style: normal; background: #e53935; color: #fff; font-size: 10px; border-radius: 8px; padding: 1px 5px; }
.ph-sos { display: flex; gap: 8px; justify-content: center; }
.ph-back { margin-bottom: 10px; }
.msgs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.msg { background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px 10px; }
.msg small { float: right; color: var(--ink-dim); } .msg p { margin: 4px 0 0; font-size: 13.5px; }
.jar { margin: 8px 0; } .jar .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); margin: 4px 0 6px; overflow: hidden; } .jar .bar i { display: block; height: 100%; background: var(--sun); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; } .gallery img { width: 100%; border-radius: 10px; display: block; margin-bottom: 4px; }
.btn.choice { display: block; width: 100%; text-align: left; margin-top: 6px; white-space: normal; }
.topics { flex-wrap: wrap; margin: 6px 0 10px; } .topics .btn { font-size: 13px; padding: 6px 10px; }
.say { background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px 12px; color: var(--ink) !important; }
#speed { font-family: var(--font-display); font-size: 18px; color: var(--sun); }
#goal { padding: 7px 10px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; cursor: pointer; border-left: 3px solid var(--sun); text-align: left; }
#quest { padding: 7px 10px; font-size: 12px; display: flex; gap: 8px; align-items: flex-start; text-align: left; border-left: 3px solid #b48cff; cursor: pointer; }
#quest .qt { display: flex; flex-direction: column; min-width: 0; } #quest small { color: var(--ink-dim); font-size: 11px; }
@media (max-height: 500px) { #quest { display: none !important; } }
#goal b { color: var(--sun); font-weight: 500; margin-left: auto; font-variant-numeric: tabular-nums; }

#hudTR { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: flex-start; }
#mini { width: clamp(96px, 16vw, 150px); height: clamp(96px, 16vw, 150px); border-radius: 50%; border: 3px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(0,0,0,0.35); cursor: pointer; background: #2c5a3a; }
.col { display: flex; flex-direction: column; gap: 8px; }
.ib { width: 46px; height: 46px; border-radius: 14px; font-size: 22px; display: grid; place-items: center; padding: 0; }

#hudB { left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: calc(100vw - 230px); }
#selName { font-size: 12px; color: var(--ink-dim); text-shadow: 0 1px 3px rgba(0,0,0,0.7); min-height: 16px; }
#hotbar { display: flex; gap: 6px; padding: 6px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
#hotbar::-webkit-scrollbar { display: none; }
.slot { position: relative; flex: 0 0 auto; width: 52px; height: 52px; border-radius: 12px; border: 2px solid transparent; background: rgba(255,255,255,0.08); display: grid; place-items: center; padding: 0; transition: transform .12s, border-color .12s; }
.slot .si { font-size: 26px; line-height: 1; }
.slot b { position: absolute; right: 3px; bottom: 1px; font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.slot i { position: absolute; left: 4px; top: 1px; font-size: 9.5px; font-style: normal; color: var(--ink-dim); }
.slot.seed { background: rgba(124, 207, 90, 0.12); }
.slot.on { border-color: var(--sun); background: rgba(255, 207, 63, 0.18); transform: translateY(-3px); }
#prompt { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(108px + env(safe-area-inset-bottom, 0px)); padding: 7px 14px; font-size: 14px; z-index: 5; pointer-events: none; white-space: nowrap; }

#hudBR { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 10px; }
#bAct { width: clamp(84px, 11vw, 104px); height: clamp(84px, 11vw, 104px); border-radius: 50%; border: 3px solid rgba(255,255,255,0.85); background: radial-gradient(circle at 35% 30%, #ffe27a, #f2a516 70%); box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 -4px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; color: #3a2408; transition: transform .1s, filter .2s; touch-action: none; }
#bAct:active { transform: scale(0.93); }
#bAct.idle { filter: grayscale(0.7) brightness(0.8); }
#bAct.info { background: radial-gradient(circle at 35% 30%, #d8e8d0, #8fb08a 70%); }
#actIcon { font-size: clamp(28px, 4vw, 36px); line-height: 1; }
#actLbl { font-size: 11px; font-weight: 600; line-height: 1.1; text-align: center; max-width: 92px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sb { width: 54px; height: 54px; border-radius: 50%; font-size: 24px; padding: 0; display: grid; place-items: center; }
.sb.on { background: rgba(255, 207, 63, 0.4); border-color: var(--sun); }
#bCar { width: auto; border-radius: 30px; padding: 0 18px; font-size: 16px; font-weight: 600; height: 54px; }

#joy { position: fixed; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); z-index: 4; pointer-events: none; opacity: 0; transition: opacity .15s; }
#joy.on { opacity: 1; }
#joyKnob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.75); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
#joyHint { position: fixed; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 96px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.35); display: grid; place-items: center; font-size: 11px; color: rgba(255,255,255,0.7); text-align: center; pointer-events: none; z-index: 3; }
body:not(.touch) #joyHint { display: none; }

#toasts { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(460px, calc(100vw - 32px)); }
.toast { background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; font-size: 14px; display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 18px rgba(0,0,0,0.3); animation: tin .25s ease-out; transition: opacity .4s, transform .4s; }
.toast .ti { font-size: 18px; }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes tin { from { opacity: 0; transform: translateY(-10px) scale(.96); } }

/* Modal sheet */
#modal { position: fixed; inset: 0; z-index: 60; background: rgba(5, 15, 10, 0.45); display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); opacity: 0; pointer-events: none; transition: opacity .2s; }
#modal.show { opacity: 1; pointer-events: auto; }
.mbox { width: min(720px, 100%); max-height: min(86vh, 760px); display: flex; flex-direction: column; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden; transform: translateY(14px); transition: transform .22s; }
#modal.wide .mbox { width: min(940px, 100%); }
#modal.show .mbox { transform: none; }
.mhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px 20px; background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent); }
.mhead h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(19px, 3vw, 24px); text-wrap: balance; }
#mWallet { margin-left: auto; font-family: var(--font-display); color: var(--sun); font-variant-numeric: tabular-nums; }
#mClose { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,0.08); font-size: 16px; }
#mTabs { display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; }
#mTabs button { border: 1px solid var(--line); background: transparent; border-radius: 30px; padding: 6px 14px; font-size: 14px; white-space: nowrap; color: var(--ink-dim); }
#mTabs button.on { background: var(--sun); color: #2f2208; border-color: var(--sun); font-weight: 500; }
#mBody { overflow-y: auto; padding: 4px 16px 18px; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }
.card { display: flex; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); min-width: 0; }
.ci { font-size: 38px; width: 52px; height: 52px; display: grid; place-items: center; flex: 0 0 auto; background: rgba(255,255,255,0.07); border-radius: 14px; }
.cb { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.cb h4 { margin: 0; font-size: 15.5px; font-weight: 500; }
.cb h4 small { color: var(--ink-dim); font-weight: 400; font-size: 12.5px; }
.cb p { margin: 0; font-size: 12.5px; color: var(--ink-dim); line-height: 1.45; }
.need span { margin-right: 6px; } .need .have { color: var(--leaf); } .need .miss { color: #f08a7a; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.row.end { justify-content: flex-end; margin: 4px 0 12px; }
.btn { border: 0; border-radius: 12px; padding: 8px 14px; font-size: 14px; font-weight: 500; background: var(--sun); color: #2f2208; font-variant-numeric: tabular-nums; }
.btn.ghost { background: rgba(255,255,255,0.1); color: var(--ink); border: 1px solid var(--line); }
.btn.big { padding: 11px 20px; font-size: 15.5px; }
.btn.danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(:disabled):active { transform: scale(.96); }
.lead { margin: 2px 0 12px; font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; }
.lead.good { color: var(--leaf); }
.empty { text-align: center; padding: 28px 10px; color: var(--ink-dim); }
h5 { font-family: var(--font-display); font-weight: 500; font-size: 15px; margin: 14px 0 8px; color: var(--sun); letter-spacing: .02em; }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.sw button { width: 92px; height: 64px; border-radius: 14px; border: 3px solid transparent; display: flex; align-items: flex-end; justify-content: center; padding: 4px; color: #2b2b2b; font-size: 12px; font-weight: 500; }
.sw button.on { border-color: var(--sun); box-shadow: 0 0 0 2px rgba(0,0,0,0.3); }
.sw span { background: rgba(255,255,255,0.75); padding: 1px 6px; border-radius: 8px; }
.menu { display: flex; flex-direction: column; gap: 8px; }
.menu > .btn { text-align: left; }
.mapwrap { width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
#bigmap { width: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-dim); margin-top: 10px; }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 10px; }
.hc { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px 10px; }
.hc ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.65; color: var(--ink-dim); }

#fishUI { position: fixed; inset: 0; z-index: 7; touch-action: none; }
#fishCancel { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); }
.fpanel { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100vw - 32px)); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
#fishHint { font-size: 15px; font-weight: 500; }
#fishUI.bite #fishHint { color: var(--sun); font-size: 22px; animation: blink .35s infinite; }
.ftrack { position: relative; height: 38px; border-radius: 12px; background: linear-gradient(180deg, #1f5f7a, #134457); overflow: hidden; border: 1px solid var(--line); }
#fZone { position: absolute; top: 3px; bottom: 3px; border-radius: 9px; background: rgba(124, 207, 90, 0.45); border: 2px solid rgba(124, 207, 90, 0.8); transition: background .1s; }
#fZone.on { background: rgba(124, 207, 90, 0.75); }
#fFish { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.fprog { height: 10px; border-radius: 6px; background: rgba(0,0,0,0.35); overflow: hidden; }
#fProg { display: block; height: 100%; width: 30%; background: linear-gradient(90deg, #f5a623, var(--sun)); }
#moveUI { position: fixed; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 8; width: min(440px, calc(100vw - 32px)); }
.mpanel { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; text-align: center; font-size: 14px; }
.mpanel .row { justify-content: center; }
#modal.side { justify-content: flex-end; background: transparent; pointer-events: none; }
#modal.side .mbox { pointer-events: auto; width: min(380px, 100%); max-height: 92vh; }
@media (max-width: 640px) { #modal.side { align-items: flex-end; } #modal.side .mbox { width: 100%; max-height: 52vh; } }
.sw.small button { width: 40px; height: 40px; border-radius: 50%; padding: 0; }
.sw.small button.txt { width: auto; height: 36px; border-radius: 18px; padding: 0 12px; background: rgba(255,255,255,0.1); color: var(--ink); border: 2px solid var(--line); align-items: center; }

.lvrow { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.lvrow b { color: var(--sun); font-weight: 600; min-width: 34px; }
.bar.xp { flex: 1; height: 6px; } #xpBar { background: linear-gradient(90deg, #8e6cf0, #c9a7ff); }
.hearts { letter-spacing: 1px; font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; font-size: 13px; color: var(--ink-dim); }
.field input { font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: var(--ink); }
.field input:focus { outline: 2px solid var(--sun); }
.order { border-left: 3px solid var(--sun); }
.prog { height: 6px; border-radius: 4px; background: rgba(0,0,0,0.3); overflow: hidden; margin: 2px 0 4px; } .prog i { display: block; height: 100%; background: var(--leaf); }
